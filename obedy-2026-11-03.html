<title>Obědy Zlín</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ovládání nahoře, pod ním restaurace (nebo jeden seznam všech jídel); dish = karta na telefonu, řádek tabulky od 760px */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1d2a24; --muted:#5b6b62; --line:#dde3dd;
  --best:#1f7a4d; --best-bg:#e3f3ea; --fish:#2b6cb0; --fish-bg:#e4eef9; --soup:#9a6b12; --soup-bg:#f6ecd6;
  --on:#1d2a24; --on-fg:#f3f5f2;
  --f-body:'Figtree',system-ui,sans-serif; --f-num:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a16; --surface:#1b2520; --fg:#e8eee9; --muted:#9bab9f; --line:#2c3a33;
  --best:#5fd197; --best-bg:#163626; --fish:#7db3ee; --fish-bg:#172a40; --soup:#e3b55a; --soup-bg:#3a2f14;
  --on:#e8eee9; --on-fg:#121a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a16; --surface:#1b2520; --fg:#e8eee9; --muted:#9bab9f; --line:#2c3a33;
  --best:#5fd197; --best-bg:#163626; --fish:#7db3ee; --fish-bg:#172a40; --soup:#e3b55a; --soup-bg:#3a2f14;
  --on:#e8eee9; --on-fg:#121a16; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:1.6rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:.9rem}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:.8rem}
.chip{padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--best);outline-offset:2px}

.controls{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:64px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-fg)}
.f{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;cursor:pointer;font-size:.85rem}
.f[aria-pressed="true"]{background:var(--on);color:var(--on-fg);border-color:var(--on)}
select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:.85rem;max-width:100%}
input[type=range]{flex:1 1 140px;max-width:260px;accent-color:var(--best)}
.kv{font-family:var(--f-num);font-size:.85rem;min-width:72px}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.8rem}
.count{font-size:.8rem;color:var(--muted)}

.rest{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.rest header{padding:12px 14px;border-bottom:1px solid var(--line)}
.rest h2{margin:0;font-size:1.05rem}
.addr{color:var(--muted);font-size:.8rem}
.tip{padding:8px 14px;font-size:.85rem;background:var(--best-bg);color:var(--best)}
.empty{padding:10px 14px;font-size:.85rem;color:var(--muted)}
.hid{padding:6px 14px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--line)}
.dish{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-top:1px solid var(--line)}
.cols+.dish{border-top:0}
.name{font-weight:600;min-width:0}
.from{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
.price{font-family:var(--f-num);font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-num);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.m b{color:var(--fg);font-weight:500}
.m span::before{content:attr(data-l)" ";font-family:var(--f-body);font-size:.72rem}
.best{background:var(--best-bg)} .best .name{color:var(--best)}
.fish .name{color:var(--fish)} .soup .name{color:var(--soup)}
.note{font-size:.8rem;color:var(--muted)}
.note a{color:inherit}
.cols button{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;text-align:inherit}
.cols button[aria-pressed="true"]{color:var(--fg);font-weight:700}
@media(min-width:760px){
  .cols,.dish{display:grid;grid-template-columns:minmax(0,1fr) 72px 56px 48px 48px 48px 72px;gap:0 8px;align-items:baseline}
  .cols{padding:6px 14px;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line)}
  .cols > *:nth-child(n+2){text-align:right}
  .m{display:contents}
  .price{order:2}.m span{text-align:right;order:3}
  .m span::before{content:none}
  .name{order:1}
}
@media(max-width:759px){.cols{display:none}}
</style>
<main>
<div><h1 id="h1">Obědy Zlín</h1>
<p class="sub" id="sub"></p></div>

<div class="controls" role="group" aria-label="Třídění a filtry">
  <div class="row"><span class="lbl">Zobrazit</span>
    <span class="seg"><button type="button" id="v-rest" data-view="rest">Podle restaurací</button><button type="button" id="v-all" data-view="all">Všechna jídla</button></span>
  </div>
  <div class="row"><label class="lbl" for="sort">Seřadit</label>
    <select id="sort">
      <option value="def">Výchozí (podle restaurace)</option>
      <option value="ratio">Bílkoviny na 100 kcal ↓</option>
      <option value="kcal">kcal ↑</option>
      <option value="b">Bílkoviny ↓</option>
      <option value="s">Sacharidy ↑</option>
      <option value="t">Tuky ↑</option>
      <option value="price">Cena ↑</option>
    </select>
  </div>
  <div class="row"><span class="lbl">Druh</span>
    <button type="button" class="f" data-druh="k">Kuřecí/krůtí</button>
    <button type="button" class="f" data-druh="v">Vepřové</button>
    <button type="button" class="f" data-druh="h">Hovězí</button>
    <button type="button" class="f" data-druh="z">🌱 Bez masa</button>
    <button type="button" class="f" data-druh="r">🐟 Ryby</button>
  </div>
  <div class="row"><span class="lbl">Skrýt</span>
    <button type="button" class="f" id="nofried" title="Obalované nebo smažené hlavní jídlo. Přílohu (hranolky) si můžeš vyměnit, proto se nepočítá.">Smažené</button>
    <button type="button" class="f" id="nosoup">Polévky a saláty</button>
  </div>
  <div class="row"><label class="lbl" for="maxk">Max. kcal</label>
    <input type="range" id="maxk" min="300" max="1400" step="50">
    <output class="kv" id="maxk-out" for="maxk"></output>
  </div>
  <div class="row"><span class="count" id="count"></span><button type="button" class="link" id="reset">Výchozí nastavení</button></div>
</div>

<div class="legend"><span class="chip">✅ nejlepší volba</span><span class="chip">🥣 polévka</span><span class="chip">🌱 bez masa</span><span class="chip">🐟 ryba</span><span class="chip">B bílkoviny · S sacharidy · T tuky (g)</span><span class="chip">B/100 = g bílkovin na 100 kcal</span></div>
<div id="out" style="display:contents"></div>
<p class="note">Kalorie a makra jsou moje hrubé odhady, restaurace je neuvádějí. Jídla a ceny z jednotlivých stránek na <a href="https://www.menicka.cz/zlin.html">menicka.cz</a>.</p>
</main>

(function(){

function price(d){var n=parseInt(String(d[1]).replace(/\s/g,""),10);return isNaN(n)?0:n}
var SORTS={
  ratio:function(a,b){return ratio(b)-ratio(a)},
  kcal:function(a,b){return a[2]-b[2]},

  s:function(a,b){return a[4]-b[4]},

    shown=all.length;
    var key=st.sort=="def"?"ratio":st.sort;
    all=sorted(all.filter(function(d){return !side(d)}),key).concat(sorted(all.filter(side),key));
    html='<section class="rest">'+cols()+(all.length?all.map(function(d){return row(d,d.r)}).join(''):'<div class="empty">Filtrům dnes neodpovídá žádné jídlo.</div>')+'</section>';
  }else{
    html=R.map(function(r){
      var items=r[4].map(function(d,i){var x=d.slice();x.i=i;return x});
      total+=items.length;
      var vis=items.filter(ok);shown+=vis.length;
      var best=vis.filter(function(d){return d[6]=="b"});
      var mains=sorted(vis.filter(function(d){return d[6]!="b"&&!side(d)}),st.sort);
      var sides=sorted(vis.filter(side),st.sort);
      var list=best.concat(mains,sides);
      var hidden=items.length-vis.length;
      return '<section class="rest"><header><h2><a style="color:inherit;text-decoration:none" href="'+e(r[2])+'">'+e(r[0])+'</a></h2><div class="addr">'+e(r[1])+'</div></header>'+
        (r[3]?'<div class="tip">'+e(r[3])+'</div>':'')+
        (!items.length?'<div class="empty">Dnes menu nemá.</div>':
          cols()+(list.length?list.map(function(d){return row(d)}).join(''):'<div class="empty">Filtrům neodpovídá žádné jídlo.</div>')+
          (hidden?'<div class="hid">Skryto filtrem: '+hidden+'</div>':''))+
        '</section>';
    }).join('');
  }
  $("out").innerHTML=html;
  $("count").textContent="Zobrazeno "+shown+" z "+total+" jídel.";
  sync();
}
function sync(){
  $("v-rest").setAttribute("aria-pressed",st.view=="rest");
  $("v-all").setAttribute("aria-pressed",st.view=="all");
  $("sort").value=st.sort;
  $("sort").options[0].text=st.view=="all"?"Výchozí (bílkoviny na 100 kcal)":"Výchozí (podle restaurace)";
  document.querySelectorAll("[data-druh]").forEach(function(b){b.setAttribute("aria-pressed",!!st.druh[b.dataset.druh])});
  $("nofried").setAttribute("aria-pressed",!!st.nofried);
  $("nosoup").setAttribute("aria-pressed",!!st.nosoup);
  $("maxk").value=st.maxk;
  $("maxk-out").textContent=st.maxk>=1400?"bez limitu":"≤ "+st.maxk;
}
function change(){save();render()}
document.querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){st.view=b.dataset.view;change()})});
$("sort").addEventListener("change",function(){st.sort=this.value;change()});
document.querySelectorAll("[data-druh]").forEach(function(b){b.addEventListener("click",function(){var k=b.dataset.druh;st.druh[k]=st.druh[k]?0:1;change()})});
$("nofried").addEventListener("click",function(){st.nofried=st.nofried?0:1;change()});
$("nosoup").addEventListener("click",function(){st.nosoup=st.nosoup?0:1;change()});
$("maxk").addEventListener("input",function(){st.maxk=+this.value;change()});
$("reset").addEventListener("click",function(){st=JSON.parse(JSON.stringify(DEF));change()});
$("out").addEventListener("click",function(ev){var b=ev.target.closest("[data-sort]");if(b){st.sort=b.dataset.sort;change()}});
render();
})();
</script>
