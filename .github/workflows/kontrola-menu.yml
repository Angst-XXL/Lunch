# Každých 30 minut dopoledne (v pracovní dny) zkontroluje menu na menicka.cz.
# Když se změní, zavolá malou úlohu „Obědy upozornění“, která pošle push do iPhonu.
# Tabulka se tím nepřepočítá; aktualizaci si spustíš ručně, když budeš chtít.
name: Kontrola změn menu

on:
  schedule:
    # časy jsou v UTC: v zimě 7:30–11:30, v létě 8:30–12:30 českého času
    - cron: "30 6-10 * * 1-5"
    - cron: "0 7-10 * * 1-5"
  workflow_dispatch:
    inputs:
      zkouska:
        description: "Poslat zkušební upozornění"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kontrola-menu
  cancel-in-progress: false

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Načti stav z minulé kontroly
        uses: actions/cache/restore@v4
        with:
          path: stav-menu.json
          key: stav-menu-${{ github.run_id }}
          restore-keys: stav-menu-

      - name: Zkontroluj menicka.cz
        run: python3 kontrola-menu.py

      - name: Ulož stav
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stav-menu.json
          key: stav-menu-${{ github.run_id }}

      - name: Zkušební zpráva
        if: inputs.zkouska
        run: printf '**Zkušební upozornění** – takhle bude vypadat zpráva o změně menu.\n- ➕ Ukázkové nové jídlo – 159 Kč\n- ➖ Ukázkové zrušené jídlo – 149 Kč\n' > zprava.md

      - name: Pošli upozornění do iPhonu (přes úlohu „Obědy upozornění“)
        if: hashFiles('zprava.md') != ''
        env:
          FIRE_URL: ${{ secrets.CLAUDE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.CLAUDE_FIRE_TOKEN }}
        run: |
          if [ -z "$FIRE_URL" ] || [ -z "$FIRE_TOKEN" ]; then
            echo "::warning::Chybí tajné údaje CLAUDE_FIRE_URL / CLAUDE_FIRE_TOKEN – upozornění se neposlalo."
            cat zprava.md
            exit 0
          fi
          python3 - <<'PY' > telo.json
          import json, datetime
          from zoneinfo import ZoneInfo
          cas = datetime.datetime.now(ZoneInfo("Europe/Prague")).strftime("%H:%M")
          zprava = open("zprava.md", encoding="utf-8").read().replace("**", "").strip()
          print(json.dumps({"text": f"Změna menu ({cas}):\n{zprava}"}, ensure_ascii=False))
          PY
          curl -sS --fail-with-body -X POST "$FIRE_URL" \
            -H "Authorization: Bearer $FIRE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data-binary @telo.json -o odpoved.json
          echo "Upozornění odesláno."
